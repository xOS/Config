name: Update RuleSet

on:
  workflow_dispatch:
  push:
    branches:
      - "Her"
    paths:
      - "**/*.list"
  schedule:
    - cron: "0 */24 * * *"

jobs:
  Update:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        node-version: [20]

    steps:
      - name: Fetch repository
        uses: actions/checkout@v6

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Cache node modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.OS }}-build-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.OS }}-build-${{ env.cache-name }}-
            ${{ runner.OS }}-build-
            ${{ runner.OS }}-

      - name: yarn install, update
        shell: bash
        run: |
          set -euo pipefail

          retry() {
            local max_attempts="$1"
            local delay_seconds="$2"
            shift 2

            local attempt=1
            until "$@"; do
              local exit_code=$?

              if [[ "$attempt" -ge "$max_attempts" ]]; then
                echo "[error] Command failed after ${attempt} attempts: $*"
                return "$exit_code"
              fi

              echo "[warn] Attempt ${attempt}/${max_attempts} failed (exit ${exit_code}): $*"
              echo "[info] Retrying in ${delay_seconds}s..."
              sleep "$delay_seconds"
              attempt=$((attempt + 1))
            done
          }

          yarn install
          retry 3 20 yarn update-adrules
          retry 3 10 yarn update-rulesets

      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true

      - name: commit, push
        uses: EndBug/add-and-commit@v10
        with:
          add: "-A"
          author_name: 春夏
          author_email: git@aapls.com
          message: "Update RuleSet"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
